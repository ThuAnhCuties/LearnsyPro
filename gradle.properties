org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ═══ AGP 9.0: opt-out built-in Kotlin ═══
# AGP 9.0 tự bật "built-in Kotlin" mặc định, thứ không tương thích với
# plugin org.jetbrains.kotlin.android đang dùng (xung đột DSL). Migrate
# hẳn sang built-in Kotlin là thay đổi lớn (đổi cách khai báo Kotlin
# source set trên toàn project) — tắt đi để giữ cấu trúc project hiện tại,
# giảm rủi ro khi không compile-test được trực tiếp. Có thể bật lại
# (xóa 2 dòng dưới) khi đã kiểm thử build thật và sẵn sàng migrate.
android.builtInKotlin=false
android.newDsl=false

# ═══ Tối ưu tốc độ build (nhiều RAM/cache hơn cho Gradle, không ảnh
#     hưởng runtime của app trên máy học sinh) ═══
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
kotlin.incremental=true

# ═══ R8 full mode ═══
# isMinifyEnabled=true (app/build.gradle.kts) chỉ chạy R8 ở "compat mode" mặc
# định nếu thiếu cờ này — compat mode giữ lại nhiều class/field hơn để tương
# thích ngược hành vi ProGuard cũ, không tối ưu hết mức. Full mode shrink/
# obfuscate/optimize triệt để hơn (giảm size, tối ưu hơn), nhưng cũng aggressive
# hơn với reflection — chỉ an toàn khi proguard-rules.pro đã có đủ -keep cho
# mọi thư viện dùng reflection/codegen (đã kiểm tra: kotlinx.serialization,
# Ktor, Supabase-kt — xem app/proguard-rules.pro).
# ⚠️ Bắt buộc build + cài thử bản release thật (không phải debug) trên máy/
# emulator trước khi phát hành sau khi bật cờ này — R8 không chạy được ở môi
# trường tạo file này nên chưa verify runtime được.
android.enableR8.fullMode=true
