name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Gradle CLI dùng để sinh gradlew (project chưa có sẵn wrapper)
      - name: Install Gradle CLI
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.1.0'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.1.0

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPA_URL=${{ secrets.SUPA_URL }}" >> local.properties
          echo "SUPA_KEY=${{ secrets.SUPA_KEY }}" >> local.properties
          echo "ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}" >> local.properties
          echo "UPSTASH_URL=${{ secrets.UPSTASH_URL }}" >> local.properties
          echo "UPSTASH_TOKEN=${{ secrets.UPSTASH_TOKEN }}" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── Release APK ──
      # Ký bằng keystore release thật, lưu dạng base64 trong GitHub Secret
      # (RELEASE_KEYSTORE_BASE64). Decode ra file tạm rồi trỏ
      # RELEASE_STORE_FILE tới đó — build.gradle.kts đã tự đọc 4 biến
      # RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS/
      # RELEASE_KEY_PASSWORD từ biến môi trường khi build trên CI.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: learnsy-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          
